<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#07070A">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CLIP — Page not found</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 0%, rgba(201,168,106,0.16), transparent 55%), #07070A;
  color:#fff;font-family:'Montserrat',sans-serif;display:grid;place-items:center;padding:24px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:#C9A86A;border:1px solid rgba(201,168,106,0.4);background:rgba(201,168,106,0.08);
  padding:7px 13px;border-radius:99px;margin-bottom:18px}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(54px,12vw,120px);line-height:0.85;letter-spacing:-4px;color:#fff}
h1 span{color:#C9A86A}
p{color:#8A8A90;font-size:13.5px;line-height:1.65;max-width:420px;margin:14px auto 24px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{text-decoration:none;font-weight:800;font-size:12.5px;padding:12px 20px;border-radius:99px;display:inline-flex;align-items:center;gap:8px}
.primary{background:linear-gradient(135deg,#C9A86A,#E8C99A);color:#07070A}
.ghost{border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:#fff}
.logo{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:26px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#C9A86A,#E8C99A);
  color:#07070A;display:grid;place-items:center;font-weight:900}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:19px;letter-spacing:-1px}
.logo-text span{color:#C9A86A}

@media (max-width:520px){
  body{padding:18px}
  .logo-margin{margin-bottom:18px}
  h1{font-size:clamp(48px,17vw,88px);letter-spacing:-2.5px}
  p{font-size:12.5px}
  .actions{gap:8px;width:100%}
  .actions a{flex:1;justify-content:center}
}
</style>
</head>
<body>
  <main>
    <div class="logo"><div class="logo-mark">C</div><div class="logo-text">CLIP <span>PREMIUM</span></div></div>
    <div class="badge">404 — off the reel</div>
    <h1>LOST<br><span>SCENE</span></h1>
    <p>This page does not exist or has moved. Head back home and find your next movie.</p>
    <div class="actions">
      <a class="primary" href="/">← Back to Home</a>
      <a class="ghost" href="/mylist">My List</a>
    </div>
  </main>
</body>
</html>
